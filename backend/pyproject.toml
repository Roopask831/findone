[project]
name = "findone"
version = "0.1.0"
description = "Personal job discovery, scoring, and apply assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "python-multipart>=0.0.17",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "python-dotenv>=1.0.1",
  "pypdf>=5.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
